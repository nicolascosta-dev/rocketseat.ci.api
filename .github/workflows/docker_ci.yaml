name: Docker CI

# Trigger
on:
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [ 16, 18, 20 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          # node-version: {{ matrix.node }}
          node-version: 18
          cache: 'npm'
      - run: npm install
      - run: npm test

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Login Docker container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: costtanicolas/rocketseat-ci-api:${{ steps.generate_tag.outputs.sha }},costtanicolas/rocketseat-ci-api:latest

      # - name: Build Docker image
      #   run: docker build -t costtanicolas/rocketseat-ci-api:{{ steps.generate_tag.outputs.sha }} .

      # - name: Push image
      #   run: docker push costtanicolas/rocketseat-ci-api:{{ steps.generate_tag.outputs.sha }}